[project]
name = "janus-concordia-experiment"
version = "0.1.0"
description = "Optional, non-canonical Concordia comparison experiment for Janus Observatory."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
concordia = [
  "gdm-concordia[openai]==2.4.0",
]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
janus-concordia = "janus_concordia.cli:main"
janus-concordia-run = "janus_concordia.concordia_runner:main"
janus-concordia-check = "janus_concordia.concordia_runner:check_runtime_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_concordia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
