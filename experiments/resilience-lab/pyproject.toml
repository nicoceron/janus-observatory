[project]
name = "janus-resilience-lab"
version = "0.1.0"
description = "Independent collapse-recovery reimplementation, survival analysis, sensitivity, surrogate benchmarking, and persistence analysis for the Janus Observatory experiments track."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "matplotlib>=3.9,<4",
]

[project.scripts]
janus-resilience = "janus_resilience.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_resilience"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
