[project]
name = "janus-pipeline"
version = "0.1.0"
description = "Reproducible ingestion and normalization for Janus Observatory."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "polars>=1.35,<2",
  "pydantic>=2.12,<3",
  "pypdf>=6.1,<7",
]

[project.scripts]
janus-source-lock = "janus_pipeline.source_lock:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
