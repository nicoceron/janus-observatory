name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.5.24'
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: uv sync --project pipeline --extra dev --locked
      - run: uv sync --project experiments/resilience-lab --extra dev --locked
      - run: pnpm check

  browser-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: browser-smoke (${{ matrix.project }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # WebKit renders WebGL in software on hosted runners; split it so each job stays bounded.
        include:
          - { project: chromium, shard: 1/1 }
          - { project: firefox, shard: 1/1 }
          - { project: mobile-chromium, shard: 1/1 }
          - { project: webkit, shard: 1/4 }
          - { project: webkit, shard: 2/4 }
          - { project: webkit, shard: 3/4 }
          - { project: webkit, shard: 4/4 }
          - { project: mobile-webkit, shard: 1/4 }
          - { project: mobile-webkit, shard: 2/4 }
          - { project: mobile-webkit, shard: 3/4 }
          - { project: mobile-webkit, shard: 4/4 }
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cross-browser, mobile, keyboard, and axe gates
        run: xvfb-run --auto-servernum pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --headed
      - name: Preserve browser traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  provider-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVIDERS_CONFIGURED: ${{ secrets.DEEPSEEK_API_KEY != '' && secrets.VOYAGE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe configured providers
        if: env.PROVIDERS_CONFIGURED == 'true'
        run: pnpm probe:ai
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          JANUS_LLM_MODEL: deepseek-v4-flash
          VOYAGE_EMBEDDING_MODEL: voyage-4-lite
          VOYAGE_EMBEDDING_DIMENSIONS: '1024'
